site_name: Device Operations API
site_description: Public-safe API documentation portfolio sample by Nilesh Gunjal.
site_url: https://nilesh21-gunjal.github.io/Technical-Writing-Portfolio/API-Documentation/
repo_url: https://github.com/Nilesh21-gunjal/Technical-Writing-Portfolio
repo_name: Technical-Writing-Portfolio
edit_uri: edit/Main/API-Documentation/docs/
docs_dir: docs
site_dir: ../site-api

theme:
  name: material
  language: en
  font: false
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - content.code.copy
    - content.code.select
    - search.highlight
    - search.suggest

plugins:
  - search

extra:
  generator: false

extra_css:
  - stylesheets/portfolio-api.css
  - https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css

extra_javascript:
  - https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js
  - javascripts/swagger-reference.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Overview: index.md
  - Get started:
      - Quickstart: get-started/quickstart.md
      - Authentication: get-started/authentication.md
  - Concepts:
      - Device model and lifecycle: concepts/device-model.md
      - Telemetry and alerts: concepts/telemetry-and-alerts.md
      - Pagination and filtering: concepts/pagination-and-filtering.md
  - Guides:
      - Register a device: guides/register-device.md
      - Manage a device: guides/manage-devices.md
      - Query telemetry: guides/query-telemetry.md
      - Resolve an alert: guides/resolve-alert.md
      - Retrieve a usage summary: guides/retrieve-usage.md
  - Tutorial:
      - Complete a device workflow: tutorials/device-workflow.md
  - Reference:
      - Interactive API reference: reference/api-reference.md
      - Errors and troubleshooting: operations/errors.md
      - Rate limits: operations/rate-limits.md
      - Versioning and deprecation: operations/versioning.md
      - Changelog: operations/changelog.md
  - Support:
      - Glossary: support/glossary.md
      - FAQ: support/faq.md
      - Troubleshooting: support/troubleshooting.md
  - Documentation decisions: design-decisions.md
  - Writing conventions: style-guide.md
