name: Documentation quality

on:
  push:
    branches:
      - Main
  pull_request:
    branches:
      - Main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Check repository links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check local links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --verbose
            --no-progress
            --root-dir "$(pwd)"
            './**/*.md'
            './**/*.html'
          fail: true
          jobSummary: true

  openapi:
    name: Validate OpenAPI specification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Lint OpenAPI specification
        run: npx --yes @redocly/cli@latest lint --extends minimal --format=github-actions API-Documentation/openapi.yaml
