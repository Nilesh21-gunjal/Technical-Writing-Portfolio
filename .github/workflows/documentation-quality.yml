name: Documentation quality

on:
  push:
    branches:
      - Main
  pull_request:
    branches:
      - Main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate API documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-docs.txt

      - name: Validate OpenAPI schema
        run: pnpm validate:openapi

      - name: Lint OpenAPI with Redocly
        run: pnpm lint:openapi

      - name: Lint OpenAPI with Spectral
        run: pnpm lint:spectral

      - name: Build API documentation portal
        run: pnpm build:api-docs

      - name: Build Docs-as-Code user guide
        run: pnpm build:docs-guide

      - name: Build standalone VSH-450 manual
        run: pnpm build:manual

      - name: Check standalone manual is current
        run: git diff --exit-code -- output/html/VSH450_Service_and_Maintenance_Manual_Rev_C.html

      - name: Test API contract and code examples
        run: pnpm test:api

      - name: Build GitHub Pages output
        run: pnpm build:site

      - name: Check VSH-450 publication inventory and cross-references
        run: python scripts/check_vsh450_manual.py

      - name: Check source HTML accessibility essentials
        run: node .github/scripts/check-accessibility.mjs

      - name: Check generated-site accessibility essentials
        run: node .github/scripts/check-accessibility.mjs site

      - name: Start generated-site preview
        run: python -m http.server 4173 --directory site > /tmp/portfolio-http.log 2>&1 &

      - name: Check responsive layouts
        run: pnpm test:responsive

      - name: Lint portfolio prose with Vale
        uses: vale-cli/vale-action@v3
        with:
          config: .vale.ini
          files: '["README.md", "index.html", "API-Documentation", "work", "case-studies", "samples", "docs", "GitHub for Technical Writers - A Beginner’s Guide to Docs-as-Code", "Microsoft Word 2010 to Microsoft 365 Transition Guide"]'
          fail_level: error
          sync: false

      - name: Check local links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --verbose
            --no-progress
            --root-dir "$(pwd)"
            './README.md'
            './API-Documentation/**/*.md'
            './samples/**/*.md'
            './GitHub for Technical Writers - A Beginner’s Guide to Docs-as-Code/**/*.md'
            './site/index.html'
            './site/API-Documentation/index.html'
            './site/API-Documentation/**/index.html'
            './site/docs-as-code-guide/index.html'
            './site/docs-as-code-guide/**/index.html'
            './site/work/**/*.html'
          fail: true
          jobSummary: true
